[package]
name = "loggy"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# WebSocket
tokio-tungstenite = "0.26"
futures-util = "0.3"

# Docker API
bollard = "0.18"

# Database
clickhouse = "0.6"
# clickhouse's Reflection derive expands to ::reflection::*, so it must be a direct dep
reflection = "0.1.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async
async-trait = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
toml = "0.8"
directories = "5"

# Pattern detection
regex = "1"
lazy_static = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "loggy"
path = "src/main.rs"

[dependencies.yew]
version = "0.22"
features = ["csr"]  # Client-side rendering
