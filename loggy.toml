# Loggy Configuration

[server]
host = "0.0.0.0"
port = 8080
workers = 2

[discovery]
paths = [
    "/home/user/projects",
    "/opt/docker",
    "."
]
exclude = [
    "**/node_modules/**",
    "**/dist/**",
    "**/target/**"
]

[storage]
retention_days = 7
compression = true
data_dir = "./data"

[database]
host = "localhost"
port = 9000
database = "loggy"
username = "default"
password = ""
max_connections = 10

[docker]
socket_path = "/var/run/docker.sock"
poll_interval_ms = 1000

[auth]
enabled = false
api_keys = []

[cors]
allowed_origins = ["*"]
allowed_methods = ["GET", "POST", "PUT", "DELETE"]
allowed_headers = ["*"]
allow_credentials = false

[background]
enable_log_streaming = true
enable_metrics_collection = true
log_stream_interval_ms = 5000
metrics_interval_ms = 10000
log_buffer_size = 10000
