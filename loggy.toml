# Loggy Configuration

[server]
host = "0.0.0.0"
port = 8080

[discovery]
paths = [
    "/home/user/projects",
    "/opt/docker",
    "."
]
exclude = [
    "**/node_modules/**",
    "**/dist/**",
    "**/target/**"
]

[storage]
retention_days = 7
compression = true
data_dir = "./data"

# NOTE: section name is [database], matching Config::database — not [clickhouse]
[database]
host = "localhost"
# 8123 = ClickHouse HTTP port. The client speaks HTTP; 9000 is the native protocol.
port = 8123
database = "loggy"
username = "default"
password = ""
max_connections = 10

[docker]
socket_path = "/var/run/docker.sock"
poll_interval_ms = 1000
