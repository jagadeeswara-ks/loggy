<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loggy - Docker Observability (WASM)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #0d1117; 
            color: #c9d1d9; 
        }
        .header { 
            background: #161b22; 
            padding: 1rem; 
            border-bottom: 1px solid #30363d; 
        }
        .header h1 { color: #58a6ff; font-size: 1.5rem; }
        .container { max-width: 1400px; margin: 0 auto; padding: 1rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .card { 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 6px; 
            padding: 1rem; 
        }
        .card h2 { 
            color: #8b949e; 
            font-size: 0.875rem; 
            text-transform: uppercase; 
            margin-bottom: 0.75rem;
            border-bottom: 1px solid #30363d;
            padding-bottom: 0.5rem;
        }
        .log-entry { 
            font-family: 'SF Mono', Consolas, monospace; 
            font-size: 0.8rem; 
            padding: 0.3rem 0; 
            border-bottom: 1px solid #21262d;
            display: flex;
            gap: 0.5rem;
        }
        .log-entry.error { color: #f85149; }
        .log-entry.warn { color: #d29922; }
        .log-entry.info { color: #58a6ff; }
        .log-entry.debug { color: #8b949e; }
        .log-time { color: #6e7681; min-width: 80px; }
        .log-level { min-width: 50px; font-weight: bold; }
        .container-item {
            padding: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid #21262d;
        }
        .status { 
            padding: 0.2rem 0.5rem; 
            border-radius: 4px; 
            font-size: 0.7rem; 
            text-transform: uppercase;
        }
        .status.running { background: #238636; color: white; }
        .status.stopped { background: #da3633; color: white; }
        .container-name { font-weight: 500; }
        .container-image { color: #8b949e; font-size: 0.8rem; }
        .ws-status { 
            font-size: 0.75rem; 
            padding: 0.25rem 0.5rem; 
            background: #21262d; 
            border-radius: 4px; 
            margin-bottom: 0.5rem;
            display: inline-block;
        }
        .log-container { max-height: 400px; overflow-y: auto; }
        .loading { color: #8b949e; text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        // Import the WASM module
        import init from './pkg/loggy_frontend.js';
        
        async function run() {
            // Initialize WASM
            await init();
            
            // The Yew app will mount to #app
            console.log("Loggy WASM initialized!");
        }
        
        run().catch(console.error);
    </script>
</body>
</html>
